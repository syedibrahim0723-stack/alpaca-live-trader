<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Radar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#58A6FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 12 L18 6"/><circle cx="12" cy="12" r="4"/></svg>
    News Radar
  </div>
  <form class="search" id="search">
    <label for="q" class="sr">Ticker</label>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9BA6B4" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" placeholder="Ticker, e.g. AAPL" autocomplete="off">
  </form>
  <div class="chips" id="feeds"></div>
  <span class="mono muted" id="clock" style="font-size:12px"></span>
  <a class="btn" href="/sources">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></svg>
    Sources &amp; keys
  </a>
</header>

<div class="filters">
  <span class="label">Category</span>
  <div id="cats" style="display:contents"></div>
  <span class="grow"></span>
  <label class="check"><input type="checkbox" id="newOnly"> New only</label>
  <label class="check"><input type="checkbox" id="wlOnly"> Watchlist only</label>
  <label class="check"><input type="checkbox" id="sound" checked> Sound</label>
</div>
<div class="filters" id="topicbar">
  <span class="label">Trending topics</span>
  <div id="topics" style="display:contents"></div>
  <span class="grow"></span>
  <button class="btn small" id="rebuild" type="button">Refresh topics</button>
</div>

<main class="desk">
  <section class="feed" aria-label="Live news">
    <div class="feed-head">
      <h2>Live news</h2>
      <span class="badge" id="newCount" hidden></span>
      <span class="grow"></span>
      <button class="btn small" id="seenAll" type="button">Mark all seen</button>
    </div>
    <div class="list" id="list"><div class="empty">Waiting for news… Check the Sources page if nothing arrives.</div></div>
  </section>

  <section class="side" aria-label="Technicals and price action" id="side">
    <div class="placeholder">Click a story (or search a ticker) to load its technicals and price action from Alpaca.</div>
  </section>
</main>

<template id="sideTpl">
  <div class="qhead">
    <div>
      <div style="display:flex;align-items:baseline;gap:10px"><h2 class="sym" data-f="sym"></h2><span class="muted" data-f="feed"></span></div>
      <div style="display:flex;align-items:baseline;gap:12px;margin-top:2px"><span class="price" data-f="price"></span><span class="chg" data-f="chg"></span></div>
    </div>
    <dl class="stats" data-f="stats"></dl>
  </div>
  <div class="panel">
    <div class="chart-head">
      <h3>Price action</h3>
      <span class="legend"><i style="background:#F0B429"></i>VWAP</span>
      <span class="legend"><i style="background:#B392F0"></i>EMA 9</span>
      <span class="legend"><i style="background:#58A6FF"></i>News</span>
      <span class="grow"></span>
      <div data-f="tfs" style="display:flex;gap:6px"></div>
    </div>
    <div id="chart"></div>
  </div>
  <div class="cards2">
    <div class="panel" data-f="tech"></div>
    <div class="panel" data-f="pa"></div>
  </div>
  <div class="panel" data-f="tnews"></div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
